# Isolated file DB for @DataJpaTest (never touches ./data/secure_file_vault.db)
spring.datasource.url=jdbc:sqlite:./target/test-vault.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Isolated file blobs + RSA keys for tests
app.storage.dir=./target/test-storage
app.keys.dir=./target/test-keys

