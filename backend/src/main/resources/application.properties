server.port=8080

# SQLite file DB (auto-created under backend/data/ at boot)
spring.datasource.url=jdbc:sqlite:./data/secure_file_vault.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Uploaded-file encryption storage + RSA keypair persistence (outside source code)
app.storage.dir=./storage
app.keys.dir=./keys
# DEV-ONLY fallback. Set VAULT_KEYSTORE_PASSWORD env var beyond local dev.
app.keystore.password=${VAULT_KEYSTORE_PASSWORD:changeit-dev-only}

# 10 MB cap keeps the mini-project safe from huge uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
